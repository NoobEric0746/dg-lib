#DG-LAB websocket endpoint. Recommended for mobile pairing: wss://ws.dungeon-lab.cn/ . For local mock backend use ws://<LAN-IP>:9999
wsUrl = "wss://ws.dungeon-lab.cn/"
#Reconnect automatically when socket is disconnected
autoReconnect = true
#Base reconnect delay in milliseconds
#Range: 200 ~ 120000
reconnectBaseMs = 1000
#Maximum reconnect delay in milliseconds
#Range: 1000 ~ 300000
reconnectMaxMs = 15000
#Connection timeout in milliseconds
#Range: 1000 ~ 120000
connectTimeoutMs = 8000
#Log inbound/outbound socket payloads
logTraffic = false
#Default channel for simple control command: A or B
defaultChannel = "A"
#Custom pain strength for channel A (0-200), used by addon modules
#Range: 0 ~ 200
painA = 142
#Custom pain strength for channel B (0-200), used by addon modules
#Range: 0 ~ 200
painB = 119
#Custom sensation floor for channel A (0-200), used by addon modules
#Range: 0 ~ 200
sensationFloorA = 72
#Custom sensation floor for channel B (0-200), used by addon modules
#Range: 0 ~ 200
sensationFloorB = 43
#Top-left HUD display mode: 0=normal, 1=hidden, 2=hide current strength only
#Range: 0 ~ 2
hudDisplayMode = 2

